name: Build PassMax APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract PassMax Source
        run: |
          if [ -f "PassMax-android-all-features-enabled.zip" ]; then
            echo "Extracting zip..."
            unzip -q PassMax-android-all-features-enabled.zip
            # If zip contains a folder, move its contents to root
            if [ -d "android-pass-main" ]; then
              mv android-pass-main/* .
              rmdir android-pass-main
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PassMax-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PassMax Debug APK"
          body: "Debug build with all features enabled"
          files: app/build/outputs/apk/debug/*.apk
          draft: false
